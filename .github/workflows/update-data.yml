name: Check CPS for new data

on:
  schedule:
    # Weekly, Monday 13:00 UTC (8am America/Chicago). CPS releases 20th-day
    # reports in September and revises them occasionally afterward, so a
    # weekly check is frequent enough without hammering their site.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}  # lets you trigger a check manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.git-check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl xlrd

      - name: Check CPS.edu for new report files
        run: python3 scripts/scrape_cps.py

      - name: Rebuild summary data
        run: python3 scripts/build_summary.py

      - name: Rebuild per-school data
        run: python3 scripts/build_schools.py

      - name: Refresh boundary GeoJSON (Community Areas, Networks, School attendance)
        run: python3 scripts/fetch_geo.py

      - name: Rebuild map layers + fill school group gaps
        run: python3 scripts/build_geo.py

      - name: Refresh FY27 school budget workbooks
        run: python3 scripts/fetch_budget.py

      - name: Rebuild school budget data
        run: python3 scripts/build_budget.py

      - name: Check for changes
        id: git-check
        run: |
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push new/updated data
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update CPS demographic data ($(date -u +%Y-%m-%d))"
          git push

  deploy-pages:
    needs: update-data
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Pull latest (in case update-data just pushed)
        run: git pull

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
